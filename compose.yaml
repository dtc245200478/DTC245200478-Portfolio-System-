name: linkme13
x-log: &log
  driver: json-file
  options: {max-size: "5m", max-file: "3"}
x-env: &env
  NODE_ENV: production
  DB_HOST: mysql
  DB_NAME: linkme
  DB_USER: linkme_app
  DB_PASSWORD_FILE: /run/secrets/db_app_password
  SESSION_SECRET_FILE: /run/secrets/session_secret
  TZ: Asia/Ho_Chi_Minh
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  storage-init:
    image: alpine:3.23.3
    user: "0:0"
    command: [sh, -ec, 'for f in /logs/nginx/access.log /logs/nginx/error.log; do if [ -L "$$f" ]; then unlink "$$f"; fi; done; touch /logs/mysql/error.log /logs/mysql/slow.log /logs/nginx/access.log /logs/nginx/error.log; chown 999:999 /data/mysql /logs/mysql /logs/mysql/*.log; chown 101:101 /logs/nginx /logs/nginx/*.log; chown 1000:1000 /logs/app /data/uploads; chmod 755 /logs/mysql /logs/nginx /logs/app /data/uploads; chmod 644 /logs/mysql/*.log /logs/nginx/*.log']
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes: [mysql_data:/data/mysql, mysql_logs:/logs/mysql, nginx_logs:/logs/nginx, app_logs:/logs/app, uploads:/data/uploads]
    logging: *log
  mysql:
    <<: *hardening
    build: {context: ., dockerfile: infra/mysql/Dockerfile}
    image: linkme13-mysql:8.4.8
    user: "999:999"
    restart: unless-stopped
    environment: {MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password, MYSQL_DATABASE: linkme, TZ: UTC}
    depends_on: {storage-init: {condition: service_completed_successfully}}
    secrets: [db_root_password, db_app_password, db_migrate_password, db_admin_password, db_exporter_password]
    volumes: [mysql_data:/var/lib/mysql, mysql_logs:/var/log/mysql]
    tmpfs: [/tmp, "/var/run/mysqld:uid=999,gid=999,mode=0755"]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$(cat /run/secrets/db_root_password) mysql -uroot --protocol=tcp -h127.0.0.1 -Nse "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    logging: *log
  migrate:
    <<: *hardening
    image: linkme13-app:1.0.0
    user: "1000:1000"
    command: [node, scripts/migrate.mjs]
    environment:
      <<: *env
      DB_USER: linkme_migrate
      DB_PASSWORD_FILE: /run/secrets/db_migrate_password
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [db_migrate_password, admin_password]
    depends_on: {mysql: {condition: service_healthy}}
    networks: [database]
    tmpfs: [/tmp]
    logging: *log
  app:
    <<: *hardening
    build: ./app
    image: linkme13-app:1.0.0
    user: "1000:1000"
    restart: unless-stopped
    environment: *env
    secrets: [db_app_password, session_secret]
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [frontend, database, monitoring]
    volumes: [app_logs:/var/log/app, uploads:/data/uploads]
    tmpfs: [/tmp, "/app/.next/cache:uid=1000,gid=1000"]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    logging: *log
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.28.2-alpine
    user: "101:101"
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8088}:8080"]
    volumes: [./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro, nginx_logs:/var/log/nginx]
    depends_on: {app: {condition: service_healthy}}
    networks: [frontend, monitoring, edge]
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 8
    mem_limit: 128m
    logging: *log
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    ports: ["127.0.0.1:${DB_TOOL_PORT:-8089}:80"]
    environment: {PMA_HOST: mysql, PMA_PORT: "3306", PMA_ARBITRARY: "0", UPLOAD_LIMIT: 16M, HIDE_PHP_VERSION: "true", APACHE_PORT: "80"}
    depends_on: {mysql: {condition: service_healthy}}
    networks: [database, tools]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, php, -d, allow_url_fopen=1, -r, "exit(@file_get_contents('http://127.0.0.1/')===false?1:0);"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 384m
    logging: *log
  tests:
    <<: *hardening
    profiles: [test]
    image: linkme13-app:1.0.0
    command: [node, scripts/smoke.mjs]
    environment:
      <<: *env
      BASE_URL: http://nginx:8080
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DB_USER: linkme_migrate
      DB_PASSWORD_FILE: /run/secrets/db_migrate_password
    secrets: [admin_password, db_migrate_password]
    networks: [frontend, database, monitoring]
    tmpfs: [/tmp]
    logging: *log
networks:
  frontend: {internal: true}
  database: {internal: true}
  monitoring: {internal: true}
  tools: {}
  edge: {}
volumes:
  mysql_data: {}
  mysql_logs: {}
  nginx_logs: {}
  app_logs: {}
  uploads: {}
secrets:
  db_root_password: {file: ./.local/secrets/db_root_password}
  db_app_password: {file: ./.local/secrets/db_app_password}
  db_migrate_password: {file: ./.local/secrets/db_migrate_password}
  db_admin_password: {file: ./.local/secrets/db_admin_password}
  db_exporter_password: {file: ./.local/secrets/db_exporter_password}
  admin_password: {file: ./.local/secrets/admin_password}
  session_secret: {file: ./.local/secrets/session_secret}
