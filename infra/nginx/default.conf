log_format linkme escape=json '{"time":"$time_iso8601","service":"nginx","method":"$request_method","path":"$uri","status":$status,"duration":$request_time,"bytes":$body_bytes_sent}';
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
server {
 listen 8080;
 server_name _;
 server_tokens off;
 client_max_body_size 6m;
 client_body_timeout 15s;
 client_header_timeout 15s;
 keepalive_timeout 30s;
 access_log /var/log/nginx/access.log linkme;
 error_log /var/log/nginx/error.log warn;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /metrics { return 404; }
 location = /healthz { access_log off; return 200 'ok'; }
 location = /api/admin/login {
  limit_req zone=login burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://app:3000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
 }
 location / {
  proxy_pass http://app:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_read_timeout 60s;
  proxy_buffering off;
 }
}
server { listen 8082; location = /stub_status { stub_status; access_log off; } location / {return 404;} }
